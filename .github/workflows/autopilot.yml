name: autopilot

# Metyu, 24/7 on GitHub's runners, with VIRTUAL money (read-only public market data; no orders, no
# withdrawals). Every 5 minutes (best-effort on GitHub): restore the state from the `autopilot-data` branch, then
#   - account-sync.js        (only if the owner set the secrets) verify a VIEW-ONLY exchange key,
#                            read the real balances, publish them END-TO-END ENCRYPTED
#   - autopilot.js           Polymarket prediction markets  -> status.json
#   - exchange-autopilot.js  crypto on live Coinbase prices -> exchange-status.json (+ real-money lock)
# and publish everything back to that branch (scripts/publish-state.sh). The Live Board on GitHub
# Pages reads it from there. Each step fails on its own; one failing never stops the others.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   METYU_PAUSE=true       emergency pause from the phone: no new positions, exits still managed
#   METYU_RUNNER=external  an always-on machine runs scripts/realtime.sh (1-minute ticks) and
#                          publishes; this workflow then stays out of the way (one writer only)
#
# Security: actions pinned to commit SHAs; no permissions by default (the job asks only for
# contents: write); the checkout does not keep the token; exchange secrets go ONLY to the account
# step, which refuses keys that can trade or withdraw, scrubs secrets from its output and writes
# ciphertext only; publishing refuses plaintext balances and anything that looks like a key.
on:
  schedule:
    # GitHub runs schedules best-effort and skips many slots under load (this repository saw one
    # run in ten hours at 15-minute slots). Every 5 minutes (GitHub's minimum, off the busy :00)
    # gives it more chances; the concurrency group below keeps one tick at a time, and a tick
    # that finds nothing new is cheap (~20 s). External cron or the real-time runner: see README.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: autopilot                   # one tick at a time; a slow tick is never overlapped
  cancel-in-progress: false

jobs:
  tick:
    if: vars.METYU_RUNNER != 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write                # only to update the autopilot-data branch
    env:
      METYU_PAUSE: ${{ vars.METYU_PAUSE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 (Node 24)
        with:
          persist-credentials: false # the token is not left in .git/config for later steps
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: "22"
      - name: Restore the state from the autopilot-data branch
        run: scripts/restore-state.sh data --all
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Account sync (view-only key, end-to-end encrypted; skipped without secrets)
        continue-on-error: true
        run: node account-sync.js --out data/account.enc.json --public-out data/account-public.json
        env:
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          METYU_BOARD_PASSPHRASE: ${{ secrets.METYU_BOARD_PASSPHRASE }}
          SOLANA_WALLET_ADDRESS: ${{ secrets.SOLANA_WALLET_ADDRESS }}
      - name: Polymarket tick (virtual money; trains itself every 24 h; learning book on)
        continue-on-error: true
        run: node autopilot.js --once --train 1500 --retrain 24 --learn --state data/autopilot.json --status-out data/status.json
      - name: Crypto exchange tick (virtual money; live Coinbase prices; trains itself every 24 h; learning book on)
        continue-on-error: true
        run: node exchange-autopilot.js --once --learn --train-bars 3000 --retrain 24 --state data/exchange.json --status-out data/exchange-status.json --account-public data/account-public.json
      - name: Publish the state to the autopilot-data branch
        if: always()
        run: scripts/publish-state.sh data
        env:
          GITHUB_TOKEN: ${{ github.token }}
