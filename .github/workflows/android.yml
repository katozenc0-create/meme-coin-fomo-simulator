name: android

# Builds the Metyu Board Android app (a WebView over the same pages as the website).
# Pull requests: build only (APK attached to the run). Pushes to main: the APK is also published
# to the fixed "apk-latest" release, so the download link never changes.
on:
  push:
    branches: [main]
    paths: ["android/**", "*.html", "metyu-agent.js", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "*.html", "metyu-agent.js", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # only used to publish the release asset on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # The same debug signing key across runs, so a new APK installs over the old one. (If the
      # cache is ever evicted, the phone asks to uninstall the old app once.)
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: metyu-debug-keystore-v1
      - name: Build the APK (the runner image ships the Android SDK)
        run: gradle -p android assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - name: Check the pages are inside the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk metyu-board.apk
          unzip -l metyu-board.apk | tee apk-contents.txt
          grep -q "assets/www/board.html" apk-contents.txt
          grep -q "assets/www/metyu-agent.js" apk-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metyu-board-apk
          path: metyu-board.apk
      - name: Publish to the apk-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --target "${{ github.sha }}" --prerelease \
              --title "Metyu Board for Android (latest)" \
              --notes "Watch the Metyu Live Board on your phone. Virtual money only: read-only market data, no wallet, no orders. Download metyu-board.apk on the phone, allow installing from this source, and open Metyu Board."
          fi
          gh release upload apk-latest metyu-board.apk --clobber
          echo "Published build ${{ github.run_number }} from ${{ github.sha }}"
