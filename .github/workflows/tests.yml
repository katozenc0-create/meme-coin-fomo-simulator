name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node 24)
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: "22"
      - name: Server tests (Python)
        run: python -m unittest discover -s tests -t . -v
      - name: Agent tests (Node)
        run: node --test tests/*.test.js
      - name: Syntax check browser scripts
        run: node --check metyu-agent.js && node --check autopilot.js && node --check metyu-exchange.js && node --check exchange-autopilot.js && node --check metyu-vault.js && node --check account-sync.js && node --check metyu-wallet.js
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node 24)
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (Polymarket mocked)
        run: npm run test:e2e
