name: codeql

# Static security analysis of the JavaScript and Python code (free for public repositories).
# Findings appear under Security -> Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (Node 24)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (Node 24)
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      # Findings in the log too (rule, file:line, message), so they can be read without the
      # Security tab (e.g. by the agent that maintains this repository).
      - name: List findings
        if: always()
        run: |
          shopt -s nullglob
          for f in sarif-results/*.sarif; do
            jq -r '.runs[].results[]? | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text | gsub("\n"; " "))"' "$f"
          done
