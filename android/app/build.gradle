plugins {
    id "com.android.application"
}

android {
    namespace "com.metyu.board"
    compileSdk 34

    defaultConfig {
        applicationId "com.metyu.board"
        minSdk 24
        targetSdk 34
        // CI passes -PversionCode=<run number> so every published APK installs as an update.
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName "1.0.${(project.findProperty("versionCode") ?: "1")}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web pages are copied in from the repository at build time (see copyWebAssets).
    sourceSets {
        main.assets.srcDirs += ["$buildDir/generated/webassets"]
    }
}

// The app ships the same pages as the website: the Live Board, the Prediction Lab, the game and
// the shared agent. Nothing is duplicated in git; every build copies the current files.
tasks.register("copyWebAssets", Copy) {
    from(rootProject.file("..")) {
        include "*.html", "metyu-agent.js"
    }
    into "$buildDir/generated/webassets/www"
}
preBuild.dependsOn("copyWebAssets")
